name: CI

on:
  push:
    branches: [ main, geo_llm ]
  pull_request:
    branches: [ main, geo_llm ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install ruff black

      - name: Run Ruff
        run: ruff check geo_teacher_llm

      - name: Run Black Check
        run: black --check geo_teacher_llm
